# Run the Madeira events scraper on a schedule and publish the ICS to GitHub Pages.
# After the first push, enable Pages in repo Settings → Pages → Source: Deploy from branch → main → /docs.

name: Update Madeira Events Calendar

on:
  schedule:
    # Run daily at 04:00 UTC
    - cron: "0 4 * * *"
  push:
    branches: [main]
    paths:
      - "madeiraevents.py"
      - ".github/workflows/update-calendar.yml"
  workflow_dispatch: # Allow manual run from Actions tab

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # needed to push the updated ICS to the repo

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run scraper
        run: python madeiraevents.py

      - name: Publish ICS to docs for GitHub Pages
        run: |
          cp madeira_events.ics docs/madeira_events.ics

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/madeira_events.ics
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: update Madeira events calendar [automated]"
            git push
          fi
